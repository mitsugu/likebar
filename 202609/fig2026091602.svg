<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:396px;height:623px;background:#FFFFFF;" width="396px" height="623px" viewBox="0 0 396 623" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="85.001" y="36.24" fill="#000" font-size="14" textLength="223.999" font-weight="700">うつ病とダイビング再開までの流れ</text><text x="141.001" y="56.512" fill="#000" font-size="14" textLength="112" font-weight="700">最低限必要なこと</text></g><rect x="70" y="77.544" width="80" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="80" y="101.464" fill="#000" font-size="12" textLength="60">うつ病発症</text><path d="M188.001,129.784 L188.001,149.608 L168.001,153.608 L188.001,157.608 L188.001,177.432 A0,0 0 0 0 188.001,177.432 L326.001,177.432 A0,0 0 0 0 326.001,177.432 L326.001,139.784 L316.001,129.784 L188.001,129.784 A0,0 0 0 0 188.001,129.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M316.001,129.784 L316.001,139.784 L326.001,139.784 L316.001,129.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="194.001" y="149.864" fill="#000" font-size="13" textLength="78">急性期に入り</text><text x="194.001" y="168.688" fill="#000" font-size="13" textLength="117">医療上の管理対象に</text><rect x="52" y="134.92" width="116.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="62" y="158.84" fill="#000" font-size="12" textLength="96.001">うつエピソードに</text><rect x="22" y="197.432" width="176.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32" y="221.352" fill="#000" font-size="12" textLength="156.001">うつエピソードの改善・寛解</text><rect x="70" y="254.808" width="80" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="80" y="278.728" fill="#000" font-size="12" textLength="60">維持療法期</text><rect x="32.392" y="312.184" width="155.217" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.392" y="336.104" fill="#000" font-size="12" textLength="135.217">本人によるDiver Medical</text><text x="42.392" y="353.48" fill="#000" font-size="12" textLength="108.001">参加者質問票の記入</text><rect x="22" y="386.937" width="176.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32" y="410.857" fill="#000" font-size="12" textLength="132.001">必要な場合、医師による</text><text x="32" y="428.233" fill="#000" font-size="12" textLength="156.001">ダイビング適性の医学的評価</text><path d="M218.001,455.829 L218.001,485.065 L198.001,489.065 L218.001,493.065 L218.001,522.301 A0,0 0 0 0 218.001,522.301 L356.001,522.301 A0,0 0 0 0 356.001,522.301 L356.001,465.829 L346.001,455.829 L218.001,455.829 A0,0 0 0 0 218.001,455.829" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M346.001,455.829 L346.001,465.829 L356.001,465.829 L346.001,455.829" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="224.001" y="475.909" fill="#000" font-size="13" textLength="117">必要であれば医師に</text><text x="224.001" y="494.733" fill="#000" font-size="13" textLength="104">もう少し具体的な</text><text x="224.001" y="513.557" fill="#000" font-size="13" textLength="117">意見を書いてもらう</text><rect x="22" y="461.689" width="176.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32" y="485.609" fill="#000" font-size="12" textLength="156.001">必要に応じて、制限・条件等</text><text x="32" y="502.985" fill="#000" font-size="12" textLength="144.001">について医師の意見を準備</text><path d="M224.001,536.441 L224.001,565.677 L204.001,569.677 L224.001,573.677 L224.001,602.913 A0,0 0 0 0 224.001,602.913 L375.001,602.913 A0,0 0 0 0 375.001,602.913 L375.001,546.441 L365.001,536.441 L22