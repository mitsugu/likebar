<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リフロー対応の画像ギャラリー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>画像ギャラリー</h1>

    <div class="image-grid">
      <figure class="image-item">
        <img src="https://placehold.jp" alt="サンプル画像1の説明文">
        <figcaption>画像1のキャプションが入ります。</figcaption>
      </figure>

      <figure class="image-item">
        <img src="https://placehold.jp" alt="サンプル画像2の説明文">
        <figcaption>画像2のキャプションが入ります。少し長めの説明文でも自然に折り返します。</figcaption>
      </figure>

      <figure class="image-item">
        <img src="https://placehold.jp" alt="サンプル画像3の説明文">
        <figcaption>画像3のキャプションが入ります。</figcaption>
      </figure>

      <figure class="image-item">
        <img src="https://placehold.jp" alt="サンプル画像4の説明文">
        <figcaption>画像4のキャプションが入ります。</figcaption>
      </figure>
    </div>
  </main>

</body>
</html>
